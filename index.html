<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#142d4e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="广东常识通">
  <meta name="description" content="广东省考常识离线刷题、错题复习与模拟考试">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <title>广东省考常识通</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-mark">粤</div>
      <div class="brand-copy"><strong>广东省考常识通</strong><span>个人备考题库 · 离线优先</span></div>
      <button class="icon-button" id="backupBtn" title="数据备份" aria-label="数据备份">⇧</button>
    </header>

    <main id="app" class="main-content">
      <div class="loading"><div class="spinner"></div><p>正在载入题库…</p></div>
    </main>

    <nav class="bottom-nav" aria-label="主导航">
      <button data-nav="home" class="nav-item active"><span>⌂</span><small>首页</small></button>
      <button data-nav="chapters" class="nav-item"><span>▤</span><small>章节</small></button>
      <button data-nav="wrong" class="nav-item"><span>↻</span><small>错题</small><b id="wrongBadge" class="nav-badge">0</b></button>
      <button data-nav="favorites" class="nav-item"><span>☆</span><small>收藏</small></button>
      <button data-nav="stats" class="nav-item"><span>▥</span><small>统计</small></button>
    </nav>
  </div>

  <input type="file" id="importFile" accept="application/json,.json" hidden>
  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
